services:
  api:
    container_name: omni-search-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
        elasticsearch:
          condition: service_healthy
        redis:
          condition: service_healthy
    networks:
      - omni-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: omni-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - omni-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s ${ELASTICSEARCH_NODE} >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omni-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - omni-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  es_data:
    driver: local
  redis_data:
    driver: local

networks:
  omni-network:
    driver: bridge